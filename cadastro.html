<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Cadastro BTTR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <form action="">
            <h1>Cadastro BTTR</h1>
            <div class="input-box">
                <input type="text" placeholder="Nome completo" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email" required>
                <i class="bx bxs-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Senha" id="password" required>
                <i class="bx bxs-show toggle-password" id="togglePassword"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Confirmar Senha" id="confirmPassword" required>
                <i class="bx bxs-show toggle-password" id="toggleConfirmPassword"></i>
            </div>
            <button type="submit">Cadastrar</button>
            <div class="register-link">
                <p>Já tem uma conta? <a href="index.html">Faça login</a></p>
            </div>
        </form>
    </main>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.classList.remove('bxs-show');
                togglePassword.classList.add('bxs-hide');
            } else {
                passwordInput.type = 'password';
                togglePassword.classList.remove('bxs-hide');
                togglePassword.classList.add('bxs-show');
            }
        });

        toggleConfirmPassword.addEventListener('click', function() {
            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                toggleConfirmPassword.classList.remove('bxs-show');
                toggleConfirmPassword.classList.add('bxs-hide');
            } else {
                confirmPasswordInput.type = 'password';
                toggleConfirmPassword.classList.remove('bxs-hide');
                toggleConfirmPassword.classList.add('bxs-show');
            }
        });
    </script>
</body>
</html>"
